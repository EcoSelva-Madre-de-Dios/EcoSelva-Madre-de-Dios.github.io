<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Colindantes de Madre de Dios</title>
  <desc id="descripcion">Departamentos peruanos: Ucayali, Cusco y Puno. Países fronterizos: Brasil y Bolivia. Agrupación educativa sin orientación cardinal, trazados ni distancias. Fuente: Gobierno Regional de Madre de Dios, plan de 2020, página 2.</desc>
  <rect x="76" y="12" width="208" height="48" rx="9" fill="#163d2b"/>
  <text x="180" y="43" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#fff">Madre de Dios</text>
  <g text-anchor="middle" font-family="sans-serif" fill="#163d2b">
    <rect x="12" y="78" width="336" height="76" rx="9" fill="#e3eadc"/>
    <text x="180" y="105" font-size="16">DEPARTAMENTOS DEL PERÚ</text>
    <text x="180" y="135" font-size="22">Ucayali · Cusco · Puno</text>
    <rect x="12" y="172" width="336" height="76" rx="9" fill="#e3eadc"/>
    <text x="180" y="199" font-size="16">PAÍSES FRONTERIZOS</text>
    <text x="180" y="229" font-size="22">Brasil · Bolivia</text>
  </g>
</svg>
