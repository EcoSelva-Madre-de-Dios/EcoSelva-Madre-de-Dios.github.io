<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Colindantes de Madre de Dios</title><desc id="descripcion">Esquema orientativo: Ucayali y Brasil al norte; Cusco y Ucayali al oeste; Brasil y Bolivia al este; Cusco y Puno al sur. Fuente: Gobierno Regional de Madre de Dios, plan de 2020, página 2.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#58704c" stroke-width="2"/></marker></defs><rect x="130" y="100" width="100" height="58" rx="9" fill="#163d2b"/><g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#163d2b"><text x="180" y="27">N · Ucayali</text><text x="180" y="52">Brasil</text><text x="63" y="111">O · Cusco</text><text x="63" y="139">Ucayali</text><text x="296" y="111">E · Brasil</text><text x="296" y="139">Bolivia</text><text x="180" y="215">S · Cusco</text><text x="180" y="241">Puno</text></g><g font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white"><text x="180" y="124">Madre</text><text x="180" y="146">de Dios</text></g><g fill="none" stroke="#58704c" stroke-width="1.8" marker-end="url(#flecha)"><path d="M180 96V65"/><path d="M125 127h-12"/><path d="M235 127h12"/><path d="M180 164v24"/></g></svg>
