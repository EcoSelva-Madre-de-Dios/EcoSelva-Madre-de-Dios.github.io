<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">De la cuenca al río amazónico</title><desc id="descripcion">Vista oblicua conceptual: laderas y quebradas alimentan un río que forma meandros en una planicie boscosa. Una cocha de herradura queda separada del cauce. Las flechas siguen el agua hacia la salida de la cuenca. Ilustración de EcoSelva sin escala ni ubicación real.</desc>
