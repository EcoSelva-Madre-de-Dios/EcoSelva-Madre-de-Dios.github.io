<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Red de una cuenca y dinámica fluvial</title>
  <desc id="descripcion">La cuenca contiene quebradas y afluentes que desembocan en el río principal. En la planicie aparecen meandros, una cocha separada y bosque ribereño. Las flechas indican el flujo del agua. Esquema educativo, sin escala.</desc>
